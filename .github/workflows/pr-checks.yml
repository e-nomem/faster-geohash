name: PR Checks
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions: {}

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    if: github.event.pull_request.draft == false
    name: Check Actions
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read # Required to check out the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --locked --only-group github
      - run: uv run --no-sync python .github/scripts/actions-hashes.py check
  lint:
    needs: [actions]
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read # Required to check out the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --locked --only-group lint
      - id: determine-python-version
        name: Determine python version
        shell: bash
        run: echo "python-version=$(uv run --no-sync python -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ steps.determine-python-version.outputs.python-version }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run --no-sync pre-commit run --show-diff-on-failure --color=always --all-files
  tests:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - cp310 # tag::MIN_PYTHON
          - cp311
          - cp312
          - cp313
          - cp314
          - cp314t
          - cp315
          - cp315t
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            os-name: Ubuntu
          - os: macos-latest
            os-name: MacOS
    name: Tests / ${{ matrix.os-name }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read # Required to check out the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --no-sync pytest tests
  tests-green:
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
