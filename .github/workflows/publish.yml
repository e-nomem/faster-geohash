name: Publish
on:
  push:
    tags: ['*']
  workflow_dispatch: {}
permissions: {}

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  actions:
    name: Check Actions
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read # Required to check out the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --locked --only-group github
      - run: uv run --no-sync python .github/scripts/actions-hashes.py check
  sdist:
    name: Build / Sdist
    needs: [actions]
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the repo
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      artifact-filename: ${{ steps.set-artifact-filename.outputs.artifact-filename }}
      source-date-epoch: ${{ steps.set-source-date-epoch.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - run: |-
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          echo "source-date-epoch=$SOURCE_DATE_EPOCH" >> "$GITHUB_OUTPUT"
        id: set-source-date-epoch
      - run: uv build --sdist .
      - run: uv tool run twine check --strict dist/*
      - run: echo "artifact-filename=$(find dist -name '*.tar.gz' -printf '%f')" >> "$GITHUB_OUTPUT"
        id: set-artifact-filename
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        id: upload-artifact
        with:
          name: build-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0 # The tarball is already compressed
  wheels:
    strategy:
      fail-fast: false
      matrix:
        # We mostly build only abi3/abi3t wheels here, so just pick the minimum python version
        python:
          - cp310 # tag::MIN_PYTHON
          - cp314t
          - cp315t
        platform:
          - manylinux_x86_64
          - manylinux_aarch64
          - macosx_x86_64
          - macosx_arm64
        include:
          - {platform: manylinux_x86_64, os: ubuntu-24.04}
          - {platform: manylinux_aarch64, os: ubuntu-24.04-arm}
          - {platform: macosx_x86_64, os: macos-15-intel}
          - {platform: macosx_arm64, os: macos-15}
    name: Build / Wheel / ${{ matrix.python }}-${{ matrix.platform }}
    needs: [sdist]
    runs-on: ${{ matrix.os }}
    permissions: {}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.sdist.outputs.source-date-epoch }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.sdist.outputs.artifact-id }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          cache: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
      - run: uv build --wheel -o dist -C maturin.build-args=--features=abi3 ${{ needs.sdist.outputs.artifact-filename }}
      - run: uv tool run abi3audit --strict --report dist/*.whl
      - run: uv tool run twine check --strict dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-wheel-${{ matrix.python }}-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
  publish-pypi:
    name: Publish to PyPI
    if: github.repository == 'e-nomem/faster-geohash' && startsWith(github.ref, 'refs/tags/')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for token exchange/trusted publishing
    environment:
      name: PyPI
      url: https://pypi.org/project/faster-geohash/${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - run: uv publish --trusted-publishing always
