name: Publish
on:
  push:
    tags: ['*']
  workflow_dispatch: {}
permissions: {}

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  actions:
    name: Check Actions
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read # Required to check out the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --locked --only-group github
      - run: uv run --no-sync python .github/scripts/actions-hashes.py check
  sdist:
    name: Build / Sdist
    needs: [actions]
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the repo
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      artifact-filename: ${{ steps.set-artifact-filename.outputs.artifact-filename }}
      source-date-epoch: ${{ steps.set-source-date-epoch.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - run: |-
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          echo "source-date-epoch=$SOURCE_DATE_EPOCH" >> "$GITHUB_OUTPUT"
        id: set-source-date-epoch
      - run: uv build --sdist .
      - run: uv tool run twine check --strict dist/*
      - run: echo "artifact-filename=$(find dist -name '*.tar.gz' -printf '%f')" >> "$GITHUB_OUTPUT"
        id: set-artifact-filename
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        id: upload-artifact
        with:
          name: build-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0 # The tarball is already compressed
  generate_matrix:
    name: Generate Wheel Matrix
    needs: [actions]
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the repo
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: set_matrix
        run: |
          matrix="$(./.github/scripts/generate-wheel-matrix.py)"
          # Print matrix for debugging
          jq -r <<< "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate_matrix.outputs.matrix) }}
    name: Build / Wheel / ${{ matrix.python }}-${{ matrix.platform }}
    needs: [sdist, generate_matrix]
    runs-on: ${{ matrix.os }}
    permissions: {}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.sdist.outputs.source-date-epoch }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.sdist.outputs.artifact-id }}
      - name: Set MacOS deployment target
        # 10.12 is the minimum target for the rust compiler
        # but cibuildwheel uses a 10.9 for x86_64 macOS on python 3.8-3.11
        # See https://cibuildwheel.pypa.io/en/stable/platforms/#macos-version-compatibility
        # NOTE: cibuildwheel sets _PYTHON_HOST_PLATFORM and maturin uses that instead of the
        #       macos-deployment-target from env or config file so we set _PYTHON_HOST_PLATFORM
        #       directly.
        if: ${{ startsWith(matrix.platform, 'macosx_') }}
        run: |
          echo "_PYTHON_HOST_PLATFORM=macosx-$DEPLOYMENT_TARGET-$TARGET_ARCH" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.platform }}
        with:
          extras: uv
          package-dir: ${{ needs.sdist.outputs.artifact-filename }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-wheel-${{ matrix.python }}-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  publish-pypi:
    name: Publish to PyPI
    if: github.repository == 'e-nomem/faster-geohash' && startsWith(github.ref, 'refs/tags/')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for token exchange/trusted publishing
    environment:
      name: PyPI
      url: https://pypi.org/project/faster-geohash/${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - run: uv publish --trusted-publishing always
