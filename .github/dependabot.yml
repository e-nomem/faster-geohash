version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Create rollup PRs for all actions that have minor and patch version updates
      # Major versions get separate PRs
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-type: indirect
    groups:
      # Create rollup PRs for all transitive python deps
      uv-transitive-deps:
        patterns:
          - "*"
